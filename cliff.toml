
# Konfiguration für git-cliff (https://git-cliff.org/).
# Wird vom "Publish"-Workflow bei jedem veröffentlichten Release ausgeführt,
# um CHANGELOG.md automatisch um den neuen Abschnitt zu ergänzen.

[changelog]
header = """
# Changelog

Alle nennenswerten Änderungen an diesem Projekt werden hier dokumentiert.
Dieser Abschnitt wird automatisch bei jedem Release aus den Commit-Messages
erzeugt.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unveröffentlicht]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
# Nie Autoren-Namen/E-Mails ins Changelog - postprocessors greifen als
# zusätzliches Sicherheitsnetz, falls doch mal eine Adresse im gerenderten
# Text landen sollte. Gitmoji-Shortcodes werden ebenfalls entfernt.
postprocessors = [
    { pattern = '\s*:[a-z0-9_+-]+:', replace = "" },
    { pattern = '[\w.+-]+@[\w-]+\.[\w.-]+', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = []
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->✨ Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bugfixes" },
    { message = "^docs", group = "<!-- 2 -->📚 Dokumentation" },
    { message = "^refactor", group = "<!-- 3 -->🚜 Refactoring" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^test", group = "<!-- 5 -->🧪 Tests" },
    { message = "^ci", group = "<!-- 6 -->⚙️ CI" },
    { message = "^chore\\(deps", skip = true },
    { message = "^chore", group = "<!-- 7 -->🔧 Sonstiges" },
    { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
